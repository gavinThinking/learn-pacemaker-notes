<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>votequorum 怎么判定有没有 quorum</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 和 src/styles/tokens.css 同一套令牌；嵌进站点后 SVG 直接用站点的变量。 */
    :root {
      --paper: #fdfcf9; --paper-raised: #ffffff; --paper-muted: #f6f3ec; --ink: #22201b; --ink-muted: #6a6459;
      --ink-subtle: #7a7365; --line: #e7e1d5; --brand: #2f5fd0; --brand-light: #eef2fb;
      --font-display: Fraunces, "Songti SC", "Noto Serif SC", Georgia, serif;
      --font-body: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #16150f; --paper-raised: #1f1e17; --paper-muted: #1d1c15; --ink: #f2efe6; --ink-muted: #b3ac9c;
        --ink-subtle: #8b8474; --line: #34322a; --brand: #8fabf0; --brand-light: #1c2237;
      }
    }
    body { margin: 0; padding: 3rem 1rem; background: var(--paper-raised); color: var(--ink); font-family: var(--font-body); }
    .frame { max-width: 640px; margin: 0 auto; }
    .eyebrow { font: 500 0.66rem var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-subtle); margin: 0 0 0.5rem; }
    h1 { font: 400 1.75rem/1.2 var(--font-display); margin: 0 0 1.5rem; }
    .canvas { overflow-x: auto; }
  </style>
</head>
<body>
<main class="frame">
  <p class="eyebrow">Flowchart · 阶段 02</p>
  <h1>votequorum 怎么判定有没有 quorum</h1>
  <div class="canvas">
<svg id="vqd" viewBox="0 0 640 648" style="min-width: 560px" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vqd-title vqd-desc">
  <title id="vqd-title">votequorum 每次重新计票后怎么判定有没有 quorum</title>
  <desc id="vqd-desc">成员变化后 votequorum 先算出门槛：期望票数和实到票数各自过半取较大者，开了 two_node 且成员不超过两个时门槛直接取 1。然后依次判断：开了 wait_for_all 且还没见过全员到齐，就暂不给 quorum；实到票数达到门槛就有 quorum；没达到时，开了 auto_tie_breaker 且正好对半分、决胜节点在这一边，也给 quorum；否则没有 quorum，交给 Pacemaker 按 no-quorum-policy 处理。</desc>
  <defs>
    <style>
      #vqd {
        --vqd-paper: var(--paper-raised, #ffffff);
        --vqd-node: var(--paper, #fdfcf9);
        --vqd-paper-2: var(--paper-muted, #f6f3ec);
        --vqd-ink: var(--ink, #22201b);
        --vqd-muted: var(--ink-muted, #6a6459);
        --vqd-soft: var(--ink-subtle, #7a7365);
        --vqd-rule: var(--line, #e7e1d5);
        --vqd-accent: var(--brand, #2f5fd0);
        --vqd-tint: var(--brand-light, #eef2fb);
        --vqd-sans: var(--font-body, "Inter Variable", Inter, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif);
        --vqd-mono: var(--font-mono, ui-monospace, SFMono-Regular, Consolas, monospace);
      }
      #vqd .vqd-bg { fill: var(--vqd-paper); }
      #vqd .vqd-step { fill: var(--vqd-node); stroke: var(--vqd-ink); stroke-width: 1; }
      #vqd .vqd-end { fill: color-mix(in srgb, var(--vqd-ink) 3%, var(--vqd-node)); stroke: color-mix(in srgb, var(--vqd-ink) 30%, transparent); stroke-width: 1; }
      #vqd .vqd-focal { fill: var(--vqd-tint); stroke: var(--vqd-accent); stroke-width: 1.2; }
      #vqd .vqd-arrow { fill: none; stroke: var(--vqd-muted); stroke-width: 1.2; }
      #vqd .vqd-head { fill: var(--vqd-muted); }
      #vqd .vqd-mask { fill: var(--vqd-paper); }
      #vqd .vqd-name { font: 600 12px var(--vqd-sans); fill: var(--vqd-ink); }
      #vqd .vqd-sub { font: 400 10px var(--vqd-sans); fill: var(--vqd-muted); }
      #vqd .vqd-mono { font: 400 9px var(--vqd-mono); fill: var(--vqd-muted); }
      #vqd .vqd-label { font: 400 10px var(--vqd-sans); fill: var(--vqd-muted); }
      #vqd .vqd-rule { stroke: var(--vqd-rule); stroke-width: 0.8; }
    </style>
    <marker id="vqd-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon class="vqd-head" points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect class="vqd-bg" width="640" height="648"/>

  <!-- 连线（先画，压在框下面） -->
  <path class="vqd-arrow" d="M224 72 V104" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M224 172 V196" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M320 232 H400" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M224 268 V304" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M320 340 H400" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M224 376 V412" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M320 448 H500 Q508 448 508 440 V364" marker-end="url(#vqd-arrow)"/>
  <path class="vqd-arrow" d="M224 484 V520" marker-end="url(#vqd-arrow)"/>

  <rect class="vqd-mask" x="348" y="212" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="360" y="222" text-anchor="middle">是</text>
  <rect class="vqd-mask" x="232" y="280" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="244" y="290" text-anchor="middle">否</text>
  <rect class="vqd-mask" x="348" y="320" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="360" y="330" text-anchor="middle">是</text>
  <rect class="vqd-mask" x="232" y="388" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="244" y="398" text-anchor="middle">否</text>
  <rect class="vqd-mask" x="348" y="428" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="360" y="438" text-anchor="middle">是</text>
  <rect class="vqd-mask" x="232" y="496" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="244" y="506" text-anchor="middle">否</text>

  <!-- 开始 -->
  <rect class="vqd-end" x="80" y="24" width="288" height="48" rx="20"/>
  <text class="vqd-name" x="224" y="45" text-anchor="middle">成员变化，重新计票</text>
  <text class="vqd-mono" x="224" y="61" text-anchor="middle">recalculate_quorum</text>

  <!-- 算门槛 -->
  <rect class="vqd-focal" x="64" y="104" width="320" height="68" rx="6"/>
  <text class="vqd-name" x="224" y="126" text-anchor="middle">算出门槛 quorum</text>
  <text class="vqd-mono" x="224" y="144" text-anchor="middle">max((期望票+2)/2, (实到票+2)/2)</text>
  <text class="vqd-sub" x="224" y="161" text-anchor="middle">two_node 且成员不超过 2 个：门槛直接取 1</text>

  <!-- 判断 -->
  <polygon class="vqd-step" points="224,196 320,232 224,268 128,232"/>
  <text class="vqd-mono" x="224" y="228" text-anchor="middle">wait_for_all</text>
  <text class="vqd-name" x="224" y="244" text-anchor="middle">还在等全员？</text>

  <polygon class="vqd-step" points="224,304 320,340 224,376 128,340"/>
  <text class="vqd-mono" x="224" y="336" text-anchor="middle">total_votes</text>
  <text class="vqd-name" x="224" y="352" text-anchor="middle">实到票够门槛？</text>

  <polygon class="vqd-step" points="224,412 320,448 224,484 128,448"/>
  <text class="vqd-mono" x="224" y="444" text-anchor="middle">auto_tie_breaker</text>
  <text class="vqd-name" x="224" y="460" text-anchor="middle">决胜节点在这边？</text>

  <!-- 结果 -->
  <rect class="vqd-end" x="400" y="208" width="216" height="48" rx="20"/>
  <text class="vqd-name" x="508" y="229" text-anchor="middle">暂不给 quorum</text>
  <text class="vqd-mono" x="508" y="245" text-anchor="middle">Waiting for all cluster members</text>

  <rect class="vqd-focal" x="400" y="316" width="216" height="48" rx="20"/>
  <text class="vqd-name" x="508" y="337" text-anchor="middle">有 quorum</text>
  <text class="vqd-sub" x="508" y="353" text-anchor="middle">Pacemaker 照常调度、可以 fencing</text>

  <rect class="vqd-end" x="80" y="520" width="288" height="56" rx="20"/>
  <text class="vqd-name" x="224" y="543" text-anchor="middle">没有 quorum</text>
  <text class="vqd-sub" x="224" y="561" text-anchor="middle">Pacemaker 按 no-quorum-policy 处理</text>

  <!-- 图例 -->
  <line class="vqd-rule" x1="24" y1="600" x2="616" y2="600"/>
  <rect class="vqd-end" x="24" y="616" width="24" height="12" rx="6"/>
  <text class="vqd-label" x="54" y="626">开始 / 结果</text>
  <polygon class="vqd-step" points="136,622 148,616 160,622 148,628"/>
  <text class="vqd-label" x="168" y="626">按条件分支</text>
  <rect class="vqd-focal" x="252" y="616" width="24" height="12" rx="2"/>
  <text class="vqd-label" x="282" y="626">两节点集群的关键：门槛取 1，掉一个仍有 quorum</text>
</svg>
  </div>
</main>
</body>
</html>
